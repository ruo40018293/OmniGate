name: Build Release

on:
  # 手动触发：Actions 页面选 dev 分支 → Run workflow → 构建 + 发布 dev pre-release
  workflow_dispatch:
  # 推送 tag（v*）自动触发正式发版。
  # ⚠️ `v*` 只是粗筛：`version`、`v-test` 这类标签同样会命中。
  # 精确校验放在 guard job（只认 vX.Y.Z），避免白跑 5 个平台的构建。
  push:
    tags:
      - 'v*'

jobs:
  # tag 名守卫：`v*` 通配会把 `version` 这类标签也带进来。
  # 2026-10-29 真实踩坑：标签名手滑写成 `version` → 构建矩阵跑完 → release job
  # `gh release create version` 报「a release with the same tag name already exists」→ 整体失败。
  # 所以正式发版只认 vX.Y.Z，其它在 build 之前就拒绝（省几分钟矩阵时间，也让报错说人话）。
  guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 只认 vX.Y.Z 或 vX.Y.Z-预发布后缀（v0.1.4-rc1）。`version`、`v1.2` 这类一律拒。
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::标签 '$TAG' 不是 vX.Y.Z 形式，拒绝构建/发版（发版请打 v0.1.4 这样的标签）"
            echo "误推的标签删除：git push origin :refs/tags/$TAG"
            exit 1
          fi
          echo "标签 $TAG 校验通过"

  build:
    needs: guard
    # guard 在 workflow_dispatch 下是 skipped，不能让 needs 把 build 一起跳过
    if: ${{ always() && needs.guard.result != 'failure' && needs.guard.result != 'cancelled' }}
    strategy:
      matrix:
        include:
          - name: windows-amd64
            os: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            ldflags: "-H windowsgui"
            needs_rsrc: true
            suffix: .exe
          - name: macos-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
            suffix: ""
            pack_app: true
          - name: macos-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: "1"
            suffix: ""
            pack_app: true
          - name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
            suffix: ""
          - name: linux-arm64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            cgo: "0"
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      # workflow_dispatch 手动触发按钮只在默认分支显示，构建目标就是默认分支（本仓库 main）；
      # tag 触发（push v*，真正的版本校验在 guard job）则构建对应 tag 的代码
      #
      # fetch-depth: 0 —— 拉全历史。用途只有一个：让下方「末尾换行检查」能用
      # `origin/<默认分支>...HEAD` 拿到真实的改动文件集。浅克隆实测下该 diff 恒为空
      # （不创建 remote-tracking ref、HEAD~1 也不存在），会使那一步形同虚设。
      # 代价是 checkout 变慢，对这个仓库规模可忽略。
      - uses: actions/checkout@v4
        with:
          # 手动触发要检出默认分支：仓库默认分支是 main，写死 master 会直接 checkout 失败
          ref: ${{ github.event_name == 'push' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Generate icon resource (rsrc)
        if: matrix.needs_rsrc
        run: |
          go install github.com/akavel/rsrc@latest
          cp build/windows/icon.ico cmd/omnigate/icon.ico
          rsrc -ico cmd/omnigate/icon.ico -o cmd/omnigate/rsrc_windows_amd64.syso

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          OUT="dist/omnigate-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          go build -ldflags "${{ matrix.ldflags }}" -o "$OUT" ./cmd/omnigate

      # 前端静态检查（脚本随仓库走，见 scripts/ui-static-check.mjs）：
      # 断言冷却标签/汇总条渲染正确，且顶层函数/常量**不得重复定义**
      # （曾出现 renderSummary 写了两版、前者成死代码，node --check 与功能测试都发现不了）。
      # 只在单个矩阵项执行，避免 5 个平台重复跑。
      - name: Frontend static check
        if: matrix.name == 'linux-amd64'
        run: node scripts/ui-static-check.mjs

      # 文本文件末尾换行检查（**纯提示，不阻断构建**）。
      #
      # 为什么只查**本次改动**的文件（而非 git ls-files 全仓）：
      # 仓库存量有 7 个文件本就没有末尾换行（internal/cdp/hang_test.go、
      # internal/glm/{daily_score,hang,tokenexpiry}_test.go、
      # internal/qwenwork/stream_truncation_test.go、internal/sanitize/sanitize.go、
      # internal/traework/authcode_test.go），全仓检查会把 5 平台的 build job 全打挂；
      # 而顺手修它们属于无关的范围扩张。
      #
      # ⚠️ 前置条件：本步骤依赖 `fetch-depth: 0`（见 checkout 步骤）。
      # 曾经的写法用浅克隆 + `git fetch origin master`，但实测在 `--depth=1` 下
      # **恒检查 0 个文件**（浅克隆不创建 remote-tracking ref、`HEAD~1` 也不存在）——
      # 即"在 CI 里放了一盏不亮的灯"。改为完整历史后 diff 基准才真实存在。
      #
      # 语义说明：基点取**默认分支**（origin/main；不要写死 master，本仓库默认分支是 main）；手动触发时 HEAD 即默认分支，
      # 三点 diff 为空属正常（那是"没有新改动"，不是"检查失效"）。
      # 仍保持 advisory：从很旧默认分支拉出来的分支，diff 会含上述存量违规文件。
      - name: Check trailing newline of changed files (advisory)
        if: matrix.name == 'linux-amd64'
        continue-on-error: true
        run: |
          BASE="origin/${{ github.event.repository.default_branch }}"
          if git rev-parse --verify --quiet "$BASE" >/dev/null; then
            CHANGED=$(git diff --name-only --diff-filter=ACM "$BASE"...HEAD || true)
          else
            CHANGED=$(git diff --name-only --diff-filter=ACM HEAD~1 HEAD 2>/dev/null || true)
          fi
          N=$(printf '%s\n' "$CHANGED" | grep -c . || true)
          echo "待检查的改动文件数: $N"
          printf '%s\n' "$CHANGED" | while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.go|*.js|*.css|*.html|*.mjs|*.yml|*.md) ;;
              *) continue ;;
            esac
            [ -f "$f" ] || continue
            if [ -s "$f" ] && [ -n "$(tail -c 1 "$f")" ]; then
              echo "::warning file=$f::缺少文件末尾换行"
            fi
          done

      # macOS：把二进制打成可双击的 .app 并生成 .dmg（脚本见 build/macos/build-app.sh）。
      # ARCH 必须显式传：runner 架构（arm64）与目标架构（可能 amd64）未必一致。
      # REQUIRE_DMG=1 → dmg 生成失败即让 job 失败，避免发出不含 dmg 的 release。
      - name: Package macOS .app + .dmg
        if: matrix.pack_app
        env:
          ARCH: ${{ matrix.goarch }}
          REQUIRE_DMG: "1"
        run: bash build/macos/build-app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/omnigate-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

      # dmg 单独作为 artifact 上传。release job 会 find 平铺 artifacts/ 下所有文件，
      # 因此这里不需要改 release 逻辑，dmg 会自动进入 release 资产。
      # 版本号来自 internal/app/app.go 的 Version 常量，workflow 里拿不到，故用通配符；
      # 带 goarch 限定，确保只匹配本矩阵项自己那个架构的 dmg。
      #
      # ⚠️ 通配前缀必须与 build/macos/build-app.sh 的 APP_NAME 一致（当前 OmniGate）。
      # 历史上这里是全仓最容易漏的一处：改名后忘同步前缀（`WildWork-*`、`WorkBuddyAPI-*`
      # 都发生过）会匹配不到任何文件、
      # upload-artifact 因 if-no-files-found: error 而失败 → macOS job 挂 →
      # release job 被 needs 跳过 → tag 推了却没有任何 release（v0.1.1/v0.1.2 均踩过）。
      - name: Upload macOS .dmg
        if: matrix.pack_app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-dmg
          path: dist/OmniGate-*-${{ matrix.goarch }}.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 触发（push v*）→ 检出该 tag 代码；手动触发 → 检出默认分支代码
          ref: ${{ github.event_name == 'push' && github.ref || github.event.repository.default_branch }}

      # 注意顺序：先 checkout 再 download-artifact，否则 git 检出会覆盖 artifacts/
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # 默认 merge-multiple=false：每个 artifact 下载到 artifacts/<name>/ 子目录

      - name: Create or update dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 收集产物（每个 artifact 一个子目录，find 平铺）
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          echo "=== release-assets 内容 ==="
          ls -la release-assets/

          # tag 触发 → 创建新正式 release（不会碰其他分支的 release）
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            # release note 用仓库里的 RELEASE-<tag>.md（手写摘要），而非 --generate-notes
            # （后者只给 commit 链接列表，没有面向用户的变更摘要）；
            # 找不到该文件时回退到 --generate-notes，不阻塞发版。
            # 双保险：guard job 已经拦过，但 job 图被改坏/被跳过时这里也要兜住
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::标签 '$TAG' 不是 vX.Y.Z 形式，拒绝发版"
              exit 1
            fi
            # 带预发布后缀（v0.1.4-rc1）自动标记 prerelease，别让它抢「Latest」
            PRE=""
            if [[ "$TAG" == *-* ]]; then PRE="--prerelease"; fi
            NOTES="RELEASE-${TAG}.md"
            # 幂等：同名 release 已存在时**不能**再 `gh release create`
            # （会报 a release with the same tag name already exists 并让整个 job 失败，
            #  2026-10-29 就是卡在这里）。重推同名 tag 是常态，改为覆盖资产 + 更新说明。
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "=== release $TAG 已存在：覆盖资产并更新说明 ==="
              gh release upload "$TAG" release-assets/* --clobber
              if [[ -f "$NOTES" ]]; then
                gh release edit "$TAG" --title "$TAG" $PRE --notes-file "$NOTES"
              else
                gh release edit "$TAG" --title "$TAG" $PRE
              fi
            elif [[ -f "$NOTES" ]]; then
              echo "=== 使用 $NOTES 作为 release note ==="
              gh release create "$TAG" release-assets/* --title "$TAG" $PRE --notes-file "$NOTES"
            else
              echo "=== 未找到 $NOTES，回退到自动生成 notes ==="
              gh release create "$TAG" release-assets/* $PRE --generate-notes
            fi
            exit 0
          fi
          # workflow_dispatch → 每次更新同一个 dev-build 专属 release
          # 复用固定 tag，避免堆积；不会删除默认分支的任何发布包
          DEV_TAG="dev-build"
          if gh release view "$DEV_TAG" >/dev/null 2>&1; then
            gh release delete "$DEV_TAG" --yes --cleanup-tag
          fi
          gh release create "$DEV_TAG" release-assets/* --prerelease \
            --title "Dev Build $(date '+%Y-%m-%d %H:%M')" \
            --notes "Dev 分支自动构建（commit ${{ github.sha }}）"
